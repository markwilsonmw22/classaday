<svg viewBox="0 0 770 300" role="img" aria-label="How money and products move in dropshipping" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="f-ink3"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="f-aura"/></marker></defs><rect x="30" y="120" width="170" height="70" rx="12" class="f-panel"/><rect x="30" y="120" width="170" height="70" rx="12" class="s-line" stroke-width="1.2"/><text x="115.0" y="151.0" text-anchor="middle" class="t-md f-ink">Customer</text><text x="115.0" y="171.0" text-anchor="middle" class="t-sm f-ink3">sees your ad, orders</text><rect x="300" y="120" width="170" height="70" rx="12" class="f-aura-soft"/><rect x="300" y="120" width="170" height="70" rx="12" class="s-aura" stroke-width="1.2"/><text x="385.0" y="151.0" text-anchor="middle" class="t-md f-ink">Your store</text><text x="385.0" y="171.0" text-anchor="middle" class="t-sm f-ink3">Shopify + your brand</text><rect x="570" y="120" width="170" height="70" rx="12" class="f-panel"/><rect x="570" y="120" width="170" height="70" rx="12" class="s-line" stroke-width="1.2"/><text x="655.0" y="151.0" text-anchor="middle" class="t-md f-ink">Supplier</text><text x="655.0" y="171.0" text-anchor="middle" class="t-sm f-ink3">stocks, packs, ships</text><path d="M200 140 L298 140" class="s-aura" stroke-width="1.5" marker-end="url(#aa)"/><text x="249" y="128" text-anchor="middle" class="t-sm f-aura">pays $34.99</text><path d="M470 140 L568 140" class="s-aura" stroke-width="1.5" marker-end="url(#aa)"/><text x="519" y="128" text-anchor="middle" class="t-sm f-aura">pays $12.60</text><path d="M570 172 L470 172" class="s-ink" stroke-width="1.5" marker-end="url(#ah)"/><text x="519" y="192" text-anchor="middle" class="t-sm f-ink3">tracking number</text><path d="M470 172 L202 172" class="s-ink" stroke-width="1.5" marker-end="url(#ah)"/><text x="336" y="192" text-anchor="middle" class="t-sm f-ink3">order + tracking emails</text><path d="M655 190 C 655 290, 115 290, 115 192" class="s-ink" stroke-width="1.5" stroke-dasharray="5 6" marker-end="url(#ah)"/><text x="385" y="278" text-anchor="middle" class="t-sm f-ink2">the parcel goes straight from supplier to customer (5–12 days)</text><text x="30" y="50" text-anchor="start" class="t-sm f-aura">MONEY</text><path d="M90 46 H140" class="s-aura" stroke-width="1.5"/><text x="170" y="50" text-anchor="start" class="t-sm f-ink3">INFORMATION / GOODS</text><path d="M328 46 H378" class="s-ink" stroke-width="1.5"/><text x="30" y="86" text-anchor="start" class="t-md f-ink2">You keep the difference: $34.99 − $12.60 − fees − ad cost</text></svg>