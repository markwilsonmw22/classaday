V134" class="s-ink" stroke-width="1"/><text x="558" y="152" text-anchor="middle" class="t-sm f-ink3">24s</text><path d="M690 126 V134" class="s-ink" stroke-width="1"/><text x="690" y="152" text-anchor="middle" class="t-sm f-ink3">30s</text><text x="30" y="186" text-anchor="start" class="t-md f-ink2">Most viewers decide in the first 1–3 seconds. Write ten hooks for every ad you film.</text></svg>