<svg viewBox="0 0 760 392" role="img" aria-label="The six parts of a strong prompt" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="f-ink3"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="f-aura"/></marker></defs><rect x="20" y="20" width="150" height="50" rx="8" class="f-panel2"/><text x="36" y="50" class="t-sm f-aura">ROLE</text><text x="190" y="41" class="t-sm f-ink3">WHO SHOULD THE AI ACT AS?</text><text x="190" y="62" class="t-md f-ink">You are a senior e-commerce copywriter.</text><rect x="20" y="82" width="150" height="50" rx="8" class="f-panel2"/><text x="36" y="112" class="t-sm f-aura">CONTEXT</text><text x="190" y="103" class="t-sm f-ink3">WHAT DOES IT NEED TO KNOW?</text><text x="190" y="124" class="t-md f-ink">We sell a $35 posture corrector to office workers 30–50.</text><rect x="20" y="144" width="150" height="50" rx="8" class="f-aura"/><text x="36" y="174" class="t-sm f-bg">TASK</text><text x="190" y="165" class="t-sm f-ink3">WHAT EXACTLY SHOULD IT DO?</text><text x="190" y="186" class="t-md f-ink">Write 3 product page headlines.</text><rect x="20" y="206" width="150" height="50" rx="8" class="f-panel2"/><text x="36" y="236" class="t-sm f-aura">FORMAT</text><text x="190" y="227" class="t-sm f-ink3">HOW SHOULD THE ANSWER LOOK?</text><text x="190" y="248" class="t-md f-ink">A numbered list, max 10 words each.</text><rect x="20" y="268" width="150" height="50" rx="8" class="f-panel2"/><text x="36" y="298" class="t-sm f-aura">CONSTRAINTS</text><text x="190" y="289" class="t-sm f-ink3">WHAT TO AVOID OR RESPECT?</text><text x="190" y="310" class="t-md f-ink">No medical claims. Plain English.</text><rect x="20" y="330" width="150" height="50" rx="8" class="f-panel2"/><text x="36" y="360" class="t-sm f-aura">EXAMPLES</text><text x="190" y="351" class="t-sm f-ink3">SHOW WHAT GOOD LOOKS LIKE</text><text x="190" y="372" class="t-md f-ink">Like: “Sit taller by Friday.”</text></svg>