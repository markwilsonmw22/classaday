<svg viewBox="0 0 780 186" role="img" aria-label="The five steps of web scraping" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="f-ink3"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="f-aura"/></marker></defs><rect x="16" y="30" width="132" height="76" rx="12" class="f-panel"/><rect x="16" y="30" width="132" height="76" rx="12" class="s-line" stroke-width="1.2"/><text x="82.0" y="73.0" text-anchor="middle" class="t-md f-ink">1 Request</text><text x="82" y="128" text-anchor="middle" class="t-sm f-ink3" font-family="ui-monospace, Menlo, monospace">requests.get(url)</text><path d="M148 68 L166 68" class="s-aura" stroke-width="1.5" marker-end="url(#aa)"/><rect x="168" y="30" width="132" height="76" rx="12" class="f-panel"/><rect x="168" y="30" width="132" height="76" rx="12" class="s-line" stroke-width="1.2"/><text x="234.0" y="73.0" text-anchor="middle" class="t-md f-ink">2 HTML</text><text x="234" y="128" text-anchor="middle" class="t-sm f-ink3" font-family="ui-monospace, Menlo, monospace">&lt;p class=&quot;price&quot;&gt;</text><path d="M300 68 L318 68" class="s-aura" stroke-width="1.5" marker-end="url(#aa)"/><rect x="320" y="30" width="132" height="76" rx="12" class="f-aura-soft"/><rect x="320" y="30" width="132" height="76" rx="12" class="s-aura" stroke-width="1.2"/><text x="386.0" y="73.0" text-anchor="middle" class="t-md f-ink">3 Select</text><text x="386" y="128" text-anchor="middle" class="t-sm f-ink3" font-family="ui-monospace, Menlo, monospace">soup.select(&quot;.price&quot;)</text><path d="M452 68 L470 68" class="s-aura" stroke-width="1.5" marker-end="url(#aa)"/><rect x="472" y="30" width="132" height="76" rx="12" class="f-panel"/><rect x="472" y="30" width="132" height="76" rx="12" class="s-line" stroke-width="1.2"/><text x="538.0" y="73.0" text-anchor="middle" class="t-md f-ink">4 Clean</text><text x="538" y="128" text-anchor="middle" class="t-sm f-ink3" font-family="ui-monospace, Menlo, monospace">trim, fix, dedupe</text><path d="M604 68 L622 68" class="s-aura" stroke-width="1.5" marker-end="url(#aa)"/><rect x="624" y="30" width="132" height="76" rx="12" class="f-panel"/><rect x="624" y="30" width="132" height="76" rx="12" class="s-line" stroke-width="1.2"/><text x="690.0" y="73.0" text-anchor="middle" class="t-md f-ink">5 Save</text><text x="690" y="128" text-anchor="middle" class="t-sm f-ink3" font-family="ui-monospace, Menlo, monospace">CSV / Google Sheets</text><text x="16" y="170" text-anchor="start" class="t-md f-ink2">Rules at every step: robots.txt, terms of service, slow requests, no personal data you don&#x27;t need.</text></svg>