<svg viewBox="0 0 770 300" role="img" aria-label="The ask, review, refine loop" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="f-ink3"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="f-aura"/></marker></defs><rect x="300" y="30" width="170" height="64" rx="12" class="f-panel"/><rect x="300" y="30" width="170" height="64" rx="12" class="s-line" stroke-width="1.2"/><text x="385.0" y="58.0" text-anchor="middle" class="t-md f-ink">1  Ask</text><text x="385.0" y="78.0" text-anchor="middle" class="t-sm f-ink3">clear prompt</text><rect x="520" y="160" width="170" height="64" rx="12" class="f-panel"/><rect x="520" y="160" width="170" height="64" rx="12" class="s-line" stroke-width="1.2"/><text x="605.0" y="188.0" text-anchor="middle" class="t-md f-ink">2  Review</text><text x="605.0" y="208.0" text-anchor="middle" class="t-sm f-ink3">what&#x27;s wrong or missing?</text><rect x="80" y="160" width="170" height="64" rx="12" class="f-panel"/><rect x="80" y="160" width="170" height="64" rx="12" class="s-line" stroke-width="1.2"/><text x="165.0" y="188.0" text-anchor="middle" class="t-md f-ink">3  Refine</text><text x="165.0" y="208.0" text-anchor="middle" class="t-sm f-ink3">say exactly what to change</text><path d="M470 70 Q590 70 600 158" class="s-ink" stroke-width="1.5" marker-end="url(#ah)"/><path d="M520 200 L252 200" class="s-ink" stroke-width="1.5" marker-end="url(#ah)"/><path d="M160 158 Q170 70 298 70" class="s-ink" stroke-width="1.5" marker-end="url(#ah)"/><text x="385" y="280" text-anchor="middle" class="t-md f-ink2">Good results come from two or three rounds, not one perfect prompt.</text></svg>