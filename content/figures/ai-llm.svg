<svg viewBox="0 0 770 350" role="img" aria-label="How a large language model produces an answer" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="f-ink3"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="f-aura"/></marker></defs><rect x="20" y="40" width="330" height="290" rx="14" class="f-panel"/><rect x="20" y="40" width="330" height="290" rx="14" class="s-line" stroke-width="1.2"/><text x="40" y="70" text-anchor="start" class="t-sm f-aura">CONTEXT WINDOW (what the model can see)</text><rect x="40" y="88" width="290" height="48" rx="12" class="f-panel2"/><rect x="40" y="88" width="290" height="48" rx="12" class="s-line" stroke-width="1.2"/><text x="56" y="108.0" text-anchor="start" class="t-md f-ink">Instructions</text><text x="56" y="128.0" text-anchor="start" class="t-sm f-ink3">system prompt, project notes</text><rect x="40" y="146" width="290" height="48" rx="12" class="f-panel2"/><rect x="40" y="146" width="290" height="48" rx="12" class="s-line" stroke-width="1.2"/><text x="56" y="166.0" text-anchor="start" class="t-md f-ink">Files &amp; search results</text><text x="56" y="186.0" text-anchor="start" class="t-sm f-ink3">PDFs, pages, data</text><rect x="40" y="204" width="290" height="48" rx="12" class="f-panel2"/><rect x="40" y="204" width="290" height="48" rx="12" class="s-line" stroke-width="1.2"/><text x="56" y="224.0" text-anchor="start" class="t-md f-ink">The conversation so far</text><text x="56" y="244.0" text-anchor="start" class="t-sm f-ink3">every earlier message</text><rect x="40" y="262" width="290" height="48" rx="12" class="f-aura-soft"/><rect x="40" y="262" width="290" height="48" rx="12" class="s-line" stroke-width="1.2"/><text x="56" y="282.0" text-anchor="start" class="t-md f-ink">Your new message</text><text x="56" y="302.0" text-anchor="start" class="t-sm f-ink3">the prompt you just wrote</text><path d="M350 185 L418 185" class="s-aura" stroke-width="1.5" marker-end="url(#aa)"/><rect x="420" y="140" width="150" height="90" rx="12" class="f-aura-soft"/><rect x="420" y="140" width="150" height="90" rx="12" class="s-aura" stroke-width="1.2"/><text x="495.0" y="181.0" text-anchor="middle" class="t-md f-ink">The model</text><text x="495.0" y="201.0" text-anchor="middle" class="t-sm f-ink3">predicts the next token</text><path d="M570 185 L628 185" class="s-aura" stroke-width="1.5" marker-end="url(#aa)"/><rect x="630" y="150" width="120" height="70" rx="12" class="f-panel"/><rect x="630" y="150" width="120" height="70" rx="12" class="s-line" stroke-width="1.2"/><text x="690.0" y="181.0" text-anchor="middle" class="t-md f-ink">Answer</text><text x="690.0" y="201.0" text-anchor="middle" class="t-sm f-ink3">token by token</text><path d="M690 150 C 690 90, 495 90, 495 138" class="s-ink" stroke-width="1.4" stroke-dasharray="4 5" marker-end="url(#ah)"/><text x="592" y="92" text-anchor="middle" class="t-sm f-ink3">each new token is fed back in</text><text x="420" y="290" text-anchor="start" class="t-md f-ink2">No live memory of the world: it only knows its training</text><text x="420" y="312" text-anchor="start" class="t-md f-ink2">data plus whatever you put in the window.</text></svg>