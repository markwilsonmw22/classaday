<svg viewBox="0 0 780 420" role="img" aria-label="Kill or scale decision tree for a test ad" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="f-ink3"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="f-aura"/></marker></defs><rect x="250" y="16" width="260" height="70" rx="12" class="f-panel"/><rect x="250" y="16" width="260" height="70" rx="12" class="s-line" stroke-width="1.2"/><text x="380.0" y="47.0" text-anchor="middle" class="t-md f-ink">Ad has spent 1× break-even CPA</text><text x="380.0" y="67.0" text-anchor="middle" class="t-sm f-ink3">e.g. $21 for our product</text><path d="M320 86 L150 130" class="s-ink" stroke-width="1.5" marker-end="url(#ah)"/><path d="M440 86 L610 130" class="s-ink" stroke-width="1.5" marker-end="url(#ah)"/><rect x="30" y="132" width="240" height="64" rx="12" class="f-panel"/><rect x="30" y="132" width="240" height="64" rx="12" class="s-line" stroke-width="1.2"/><text x="150.0" y="160.0" text-anchor="middle" class="t-md f-ink">No sales, CTR under 1%</text><text x="150.0" y="180.0" text-anchor="middle" class="t-sm f-ink3">the hook isn&#x27;t working</text><rect x="490" y="132" width="240" height="64" rx="12" class="f-panel"/><rect x="490" y="132" width="240" height="64" rx="12" class="s-line" stroke-width="1.2"/><text x="610.0" y="160.0" text-anchor="middle" class="t-md f-ink">Has sales or add-to-carts</text><text x="610.0" y="180.0" text-anchor="middle" class="t-sm f-ink3">keep it running</text><path d="M150 196 L150 236" class="s-ink" stroke-width="1.5" marker-end="url(#ah)"/><rect x="30" y="238" width="240" height="60" rx="12" class="f-panel"/><rect x="30" y="238" width="240" height="60" rx="12" class="s-line" stroke-width="1.2"/><text x="150.0" y="273.0" text-anchor="middle" class="t-md f-late">Kill it. Test a new hook.</text><path d="M610 196 L520 236" class="s-ink" stroke-width="1.5" marker-end="url(#ah)"/><path d="M610 196 L700 236" class="s-ink" stroke-width="1.5" marker-end="url(#ah)"/><rect x="400" y="238" width="200" height="70" rx="12" class="f-aura-soft"/><rect x="400" y="238" width="200" height="70" rx="12" class="s-aura" stroke-width="1.2"/><text x="500.0" y="269.0" text-anchor="middle" class="t-md f-ink">CPA under break-even</text><text x="500.0" y="289.0" text-anchor="middle" class="t-sm f-ink3">after 2–3× spend</text><rect x="620" y="238" width="140" height="70" rx="12" class="f-panel"/><rect x="620" y="238" width="140" height="70" rx="12" class="s-line" stroke-width="1.2"/><text x="690.0" y="269.0" text-anchor="middle" class="t-md f-ink">CPA above</text><text x="690.0" y="289.0" text-anchor="middle" class="t-sm f-ink3">break-even</text><path d="M500 308 L500 346" class="s-aura" stroke-width="1.5" marker-end="url(#aa)"/><rect x="400" y="348" width="200" height="52" rx="12" class="f-panel"/><rect x="400" y="348" width="200" height="52" rx="12" class="s-line" stroke-width="1.2"/><text x="500.0" y="379.0" text-anchor="middle" class="t-md f-ok">Scale +20% / 48h</text><path d="M690 308 L690 346" class="s-ink" stroke-width="1.5" marker-end="url(#ah)"/><rect x="620" y="348" width="140" height="52" rx="12" class="f-panel"/><rect x="620" y="348" width="140" height="52" rx="12" class="s-line" stroke-width="1.2"/><text x="690.0" y="379.0" text-anchor="middle" class="t-md f-warn">Fix page / offer</text></svg>