<svg viewBox="0 0 780 196" role="img" aria-label="How search engines crawl, index and rank pages" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="f-ink3"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="f-aura"/></marker></defs><rect x="20" y="30" width="160" height="80" rx="12" class="f-panel"/><rect x="20" y="30" width="160" height="80" rx="12" class="s-line" stroke-width="1.2"/><text x="100.0" y="66.0" text-anchor="middle" class="t-md f-ink">Crawl</text><text x="100.0" y="86.0" text-anchor="middle" class="t-sm f-ink3">Googlebot follows links</text><path d="M180 70 L208 70" class="s-aura" stroke-width="1.5" marker-end="url(#aa)"/><text x="100" y="140" text-anchor="middle" class="t-sm f-ink3">IF IT BREAKS, CHECK</text><text x="100" y="162" text-anchor="middle" class="t-sm f-ink2">Sitemap, internal</text><text x="100" y="180" text-anchor="middle" class="t-sm f-ink2">links, robots.txt</text><rect x="210" y="30" width="160" height="80" rx="12" class="f-panel"/><rect x="210" y="30" width="160" height="80" rx="12" class="s-line" stroke-width="1.2"/><text x="290.0" y="66.0" text-anchor="middle" class="t-md f-ink">Index</text><text x="290.0" y="86.0" text-anchor="middle" class="t-sm f-ink3">Reads and stores pages</text><path d="M370 70 L398 70" class="s-aura" stroke-width="1.5" marker-end="url(#aa)"/><text x="290" y="140" text-anchor="middle" class="t-sm f-ink3">IF IT BREAKS, CHECK</text><text x="290" y="162" text-anchor="middle" class="t-sm f-ink2">noindex tags, canonicals,</text><text x="290" y="180" text-anchor="middle" class="t-sm f-ink2">thin content</text><rect x="400" y="30" width="160" height="80" rx="12" class="f-aura-soft"/><rect x="400" y="30" width="160" height="80" rx="12" class="s-aura" stroke-width="1.2"/><text x="480.0" y="66.0" text-anchor="middle" class="t-md f-ink">Rank</text><text x="480.0" y="86.0" text-anchor="middle" class="t-sm f-ink3">Picks the best answers</text><path d="M560 70 L588 70" class="s-aura" stroke-width="1.5" marker-end="url(#aa)"/><text x="480" y="140" text-anchor="middle" class="t-sm f-ink3">IF IT BREAKS, CHECK</text><text x="480" y="162" text-anchor="middle" class="t-sm f-ink2">Relevance, quality,</text><text x="480" y="180" text-anchor="middle" class="t-sm f-ink2">links, speed</text><rect x="590" y="30" width="160" height="80" rx="12" class="f-panel"/><rect x="590" y="30" width="160" height="80" rx="12" class="s-line" stroke-width="1.2"/><text x="670.0" y="66.0" text-anchor="middle" class="t-md f-ink">Results</text><text x="670.0" y="86.0" text-anchor="middle" class="t-sm f-ink3">What searchers see</text><text x="670" y="140" text-anchor="middle" class="t-sm f-ink3">IF IT BREAKS, CHECK</text><text x="670" y="162" text-anchor="middle" class="t-sm f-ink2">Titles, snippets,</text><text x="670" y="180" text-anchor="middle" class="t-sm f-ink2">map pack, AI answers</text></svg>